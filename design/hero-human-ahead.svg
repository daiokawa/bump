<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 840">
  <!-- README hero: SLOW DOWN / HUMAN AHEAD parody sign -->
  <rect x="8" y="8" width="624" height="824" rx="36" fill="#111111"/>
  <rect x="28" y="28" width="584" height="784" rx="24" fill="#111111" stroke="#FFC40C" stroke-width="0"/>
  <text x="320" y="180" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="130" font-weight="800" fill="#FFC40C">SLOW</text>
  <text x="320" y="330" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="130" font-weight="800" fill="#FFC40C">DOWN</text>
  <rect x="44" y="400" width="552" height="396" rx="20" fill="#FFC40C"/>
  <text x="320" y="560" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="110" font-weight="800" fill="#111111">HUMAN</text>
  <text x="320" y="700" text-anchor="middle" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
        font-size="110" font-weight="800" fill="#111111">AHEAD</text>
</svg>
